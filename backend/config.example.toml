# HAnswer backend configuration — copy to config.toml and fill in.
# config.toml is gitignored; this example is safe to commit.

[openai]
# API key/base URL are read from environment variables:
#   OAI_API_KEY
#   OAI_BASE_URL
# Do NOT put secrets here — set them in your shell or CI secrets instead.
model_default  = "gpt-5.4-pro"
model_parser   = "gpt-5.4-pro"
model_solver   = "gpt-5.4-pro"
model_vizcoder = "gpt-5.4-pro"
model_chat     = "gpt-5.4-pro"
# Legacy embedding defaults; active embeddings are configured in [embedding].
model_embed    = "text-embedding-3-large"
embed_dim      = 1536

[gemini]
# API key is read from the $GEMINI_API_KEY environment variable.
# Do NOT put the key here — set it in your shell or CI secrets instead.
# Model per task. Override as needed when new Gemini versions ship.
model_parser   = "gemini-3.1-pro-preview" # multimodal, image -> ParsedQuestion
model_solver   = "gemini-3.1-pro-preview" # text, ParsedQuestion -> AnswerPackage
model_vizcoder = "gemini-3.1-pro-preview" # text, AnswerPackage -> visualizations[]
# Legacy Gemini dense-embedding defaults; active embeddings are configured in [embedding].
# Supported in this repo:
#   - "gemini-embedding-2-preview" via google-genai path (recommended, multimodal)
#   - "gemini-embedding-001"       via google-genai path
#   - "text-embedding-004"         via legacy google-generativeai path
model_embed    = "gemini-embedding-2-preview"
embed_dim      = 1536  # MRL prefix; 1536 ≈ 50% storage of 3072, negligible recall delta

[embedding]
# Dedicated dense-embedding service used by indexing and retrieval.
# API key and endpoint are read from environment variables only:
#   EMB_API_KEY
#   EMB_URL
# For Azure OpenAI-compatible v1, use the base URL form:
#   EMB_URL=https://<resource>.openai.azure.com/openai/v1/
# and keep the deployment name in `model`.
# Do NOT put either secret in this file.
provider   = "openai"                  # "openai" | "gemini" | "bge-m3"
model      = "text-embedding-3-large"
dimensions = 1536

[postgres]
dsn = "postgresql+asyncpg://jianbo@localhost:5432/jianbo"

[milvus]
host = "localhost"
port = 19530
database = "default"
# Auto-create the dense + sparse collections on FastAPI startup if
# missing. Set to false if you provision Milvus schemas out-of-band.
auto_bootstrap = true
# PostgreSQL is the source of truth in this repo, so startup may
# drop+recreate dense collections after a dim change and then rebuild
# Milvus from PostgreSQL automatically.
recreate_dense_on_dim_mismatch = true
auto_reindex_on_bootstrap_change = true
# Keep false for local Milvus: explicit flush is heavily rate-limited and
# inserts/deletes are still queryable without forcing a flush per write.
flush_on_write = false

[server]
host = "127.0.0.1"
port = 8787
# CORS origins allowed for the Next.js dev server.
cors_origins = ["http://localhost:3333"]

[storage]
image_dir = "./data/images"
llm_prompt_log_file = "./data/logs/llm_prompts.jsonl"
llm_response_log_file = "./data/logs/llm_responses.jsonl"

[viz]
# Which engine VizCoder should prefer for newly generated visualizations.
# Both engines remain available at runtime; this only changes the LLM prompt
# bias and default generation path.
default_engine = "geogebra"  # "jsxgraph" | "geogebra"

[llm]
provider = "openai"  # "openai" | "gemini"
# Retry & repair loop knobs (§4 non-functional requirements).
# Number of retry attempts *after* the initial call for transient LLM failures
# such as 429 / 503 / timeout. 0 disables automatic paid re-attempts and lets
# the frontend surface the failure so the user can decide whether to retry.
max_retries = 0
max_repair_attempts = 0
# Global process-local Gemini concurrency limit. Set to 1 for keys that only
# tolerate strictly sequential Gemini calls; raise it later for stronger quota.
max_parallel_gemini_calls = 1
request_timeout_s = 60
stream_parser_json = false
parser_timeout_s = 90
solver_timeout_s = 300
solver_stream_recovery_timeout_s = 180
vizcoder_timeout_s = 240
dialog_timeout_s = 90
embed_timeout_s = 60
stream_recovery_timeout_s = 300
stream_solver_json = true
stream_vizcoder_json = true

[retrieval]
# M5 multi-route retrieval with RRF fusion (§3.4).
# Fast remote mode:
#   [embedding] provider="openai" + model="text-embedding-3-large" + sparse_encoder="bm25"
# Legacy Gemini remote mode:
#   [embedding] provider="gemini" + model="gemini-embedding-2-preview" + sparse_encoder="bm25"
# Strongest local mixed-language recall:
#   [embedding] provider="bge-m3" + sparse_encoder="bge-m3"
# and install the optional extra: `pip install -e .[retrieval]`.
sparse_encoder            = "bm25"          # "bm25" | "bge-m3"
multi_route               = true
rrf_k                     = 60
route_weights_dense       = 1.0
route_weights_sparse      = 1.0
route_weights_structural  = 1.0
bge_m3_model              = "BAAI/bge-m3"
bge_m3_device             = "cpu"
bge_m3_dense_dim          = 1024
wide_k_multiplier         = 3

[dialog]
# Multi-turn tutoring memory (§3.7).
model_chat                = "gemini-3.1-pro-preview"
recent_messages           = 10
max_question_context_chars = 12000
max_summary_chars         = 3000
max_key_facts             = 12
max_open_questions        = 8

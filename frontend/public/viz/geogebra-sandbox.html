<!doctype html>
<!--
  HAnswer GeoGebra viz sandbox.

  Loads the GeoGebra Apps API from the official CDN and renders one
  visualization per page lifecycle. Communicates with the host via the
  same postMessage protocol as the JSXGraph sandbox:

    Host -> iframe:
      { type: 'init' }
      { type: 'render', engine: 'geogebra',
        executionPayload?: object, spec?: object, params?: object }
      { type: 'update-params', params: object }
      { type: 'dispose' }

    Iframe -> host:
      { type: 'ready' }
      { type: 'error',  message: string }
      { type: 'metric', renderMs: number }

  Security:
  - CSP (set in next.config.js) allows scripts only from 'self' and
    https://www.geogebra.org / https://cdn.geogebra.org.
  - The sandbox attribute is "allow-scripts allow-same-origin"; the
    primary execution path is ordered GeoGebra commands, with optional
    minimal host-side script attachment when the validated payload
    explicitly requests it.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>HAnswer GeoGebra Sandbox</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    #ggb-applet { width: 100%; height: 100%; }
    #err { color: #b00020; padding: 12px; display: none; white-space: pre-wrap; font-size: 13px; }
    #loading { padding: 12px; color: #666; font-size: 13px; }
  </style>
  <script src="https://www.geogebra.org/apps/deployggb.js"></script>
</head>
<body>
  <div id="loading">加载 GeoGebra…</div>
  <div id="ggb-applet"></div>
  <pre id="err"></pre>

<script>
(function () {
  'use strict';

  var ggbApi = null;          // GeoGebra API handle once applet finishes loading
  var ggbApp = null;          // GGBApplet instance (so we can dispose it)
  var currentAppName = null;  // remembers which app surface is mounted
  var pendingRender = null;   // last render request while applet is still loading
  var scriptListeners = [];
  var scriptListenerCounter = 0;
  var activeSpec = null;

  function postTrace(action, details, status, error) {
    parent.postMessage({
      type: 'trace',
      event: {
        timestamp: new Date().toISOString(),
        source: 'sandbox',
        phase: 'runtime',
        action: action,
        status: status || 'info',
        engine: 'geogebra',
        component: 'sandbox',
        details: details || {},
        error: error || null,
      }
    }, '*');
  }

  function postReady() {
    parent.postMessage({ type: 'ready' }, '*');
  }
  function postError(msg) {
    var el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = String(msg);
    postTrace('runtime.error', { message: String(msg) }, 'error', String(msg));
    parent.postMessage({ type: 'error', message: String(msg) }, '*');
  }
  function postMetric(renderMs, details) {
    var payload = Object.assign({ render_ms: renderMs }, details || {});
    postTrace('runtime.metric', payload, 'ok', null);
    parent.postMessage({ type: 'metric', renderMs: renderMs, details: details || {} }, '*');
  }
  function clearError() {
    var el = document.getElementById('err');
    el.style.display = 'none';
    el.textContent = '';
  }
  function hideLoading() {
    var el = document.getElementById('loading');
    if (el) el.style.display = 'none';
  }

  function stripOuterQuotes(text) {
    var value = String(text || '').trim();
    if ((value[0] === '"' && value[value.length - 1] === '"')
      || (value[0] === '\'' && value[value.length - 1] === '\'')) {
      return value.slice(1, -1);
    }
    return value;
  }

  function parseSimpleArgs(text) {
    var args = [];
    var token = '';
    var depth = 0;
    var quote = null;
    var raw = String(text || '');
    for (var i = 0; i < raw.length; i++) {
      var ch = raw[i];
      if (quote) {
        token += ch;
        if (ch === quote && raw[i - 1] !== '\\') quote = null;
        continue;
      }
      if (ch === '"' || ch === '\'') {
        quote = ch;
        token += ch;
        continue;
      }
      if (ch === '(' || ch === '[' || ch === '{') {
        depth += 1;
        token += ch;
        continue;
      }
      if (ch === ')' || ch === ']' || ch === '}') {
        depth = Math.max(0, depth - 1);
        token += ch;
        continue;
      }
      if (ch === ',' && depth === 0) {
        args.push(token.trim());
        token = '';
        continue;
      }
      token += ch;
    }
    if (token.trim()) args.push(token.trim());
    return args;
  }

  function parseBoolToken(text) {
    var value = String(text || '').trim().toLowerCase();
    if (value === 'true') return true;
    if (value === 'false') return false;
    return null;
  }

  function parseNumberToken(text) {
    var value = Number(String(text || '').trim());
    return Number.isFinite(value) ? value : null;
  }

  function colorTokenToRgb(text) {
    // Only hex literals are recognised. The backend Pydantic validator
    // rejects color-name SetColor calls so the prompt is forced to emit
    // RGB triples; this fallback handles inline `#RRGGBB` if any slip in.
    var value = stripOuterQuotes(text).trim();
    if (/^#?[0-9a-fA-F]{6}$/.test(value)) {
      var hex = value.replace('#', '');
      return [
        parseInt(hex.slice(0, 2), 16),
        parseInt(hex.slice(2, 4), 16),
        parseInt(hex.slice(4, 6), 16),
      ];
    }
    return null;
  }

  function inferAppNameFromRequest(req) {
    var explicit = req
      && req.executionPayload
      && typeof req.executionPayload.preferred_geogebra_app === 'string'
      ? req.executionPayload.preferred_geogebra_app.trim().toLowerCase()
      : '';
    if (explicit === 'geometry' || explicit === 'graphing' || explicit === 'classic') {
      return explicit;
    }
    var fromSpec = req && req.spec && typeof req.spec.preferred_geogebra_app === 'string'
      ? req.spec.preferred_geogebra_app.trim().toLowerCase()
      : '';
    if (fromSpec === 'geometry' || fromSpec === 'graphing' || fromSpec === 'classic') {
      return fromSpec;
    }
    return 'classic';
  }

  function inferPerspective(settings, appName) {
    var explicit = settings && typeof settings.perspective === 'string'
      ? settings.perspective.trim()
      : '';
    if (explicit) return explicit;
    switch (String(appName || 'classic').toLowerCase()) {
      case 'graphing':
        return 'G';
      case 'geometry':
        return 'D';
      case '3d':
        return 'T';
      default:
        return 'G';
    }
  }

  function maybeApplyApiCommand(cmd) {
    var match = /^([A-Za-z][A-Za-z0-9]*)\s*\((.*)\)$/.exec(String(cmd || '').trim());
    if (!match || !ggbApi) return false;
    var name = match[1];
    var args = parseSimpleArgs(match[2]);
    var boolA;
    var boolB;
    var numA;
    var numB;

    if (name === 'SetCoordSystem') {
      var nums = args.map(parseNumberToken);
      if (nums.length === 4 && nums.every(function (x) { return x !== null; })) {
        ggbApi.setCoordSystem(nums[0], nums[1], nums[2], nums[3]);
        return true;
      }
      if (nums.length === 7 && nums.every(function (x) { return x !== null; })) {
        ggbApi.setCoordSystem(nums[0], nums[1], nums[2], nums[3], nums[4], nums[5], !!nums[6]);
        return true;
      }
      return false;
    }

    if (name === 'SetAxesVisible') {
      if (args.length === 2) {
        boolA = parseBoolToken(args[0]);
        boolB = parseBoolToken(args[1]);
        if (boolA !== null && boolB !== null) {
          ggbApi.setAxesVisible(boolA, boolB);
          return true;
        }
      }
      if (args.length === 4) {
        numA = parseNumberToken(args[0]);
        boolA = parseBoolToken(args[1]);
        boolB = parseBoolToken(args[2]);
        var boolC = parseBoolToken(args[3]);
        if (numA !== null && boolA !== null && boolB !== null && boolC !== null) {
          ggbApi.setAxesVisible(numA, boolA, boolB, boolC);
          return true;
        }
      }
      return false;
    }

    if (name === 'SetGridVisible') {
      if (args.length === 1) {
        boolA = parseBoolToken(args[0]);
        if (boolA !== null) {
          ggbApi.setGridVisible(boolA);
          return true;
        }
      }
      if (args.length === 2) {
        numA = parseNumberToken(args[0]);
        boolA = parseBoolToken(args[1]);
        if (numA !== null && boolA !== null) {
          ggbApi.setGridVisible(numA, boolA);
          return true;
        }
      }
      return false;
    }

    if (name === 'SetPerspective' && args.length === 1) {
      ggbApi.setPerspective(stripOuterQuotes(args[0]));
      return true;
    }

    if (name === 'SetAnimating' && args.length === 2) {
      boolA = parseBoolToken(args[1]);
      if (boolA !== null) {
        ggbApi.setAnimating(stripOuterQuotes(args[0]), boolA);
        return true;
      }
      return false;
    }

    if (name === 'SetValue' && args.length === 2) {
      boolA = parseBoolToken(args[1]);
      if (boolA !== null) {
        ggbApi.setValue(stripOuterQuotes(args[0]), boolA ? 1 : 0);
        return true;
      }
      numA = parseNumberToken(args[1]);
      if (numA !== null) {
        ggbApi.setValue(stripOuterQuotes(args[0]), numA);
        return true;
      }
      var textValue = stripOuterQuotes(args[1]);
      if (textValue !== String(args[1] || '').trim()) {
        ggbApi.setTextValue(stripOuterQuotes(args[0]), textValue);
        return true;
      }
      return false;
    }

    if (name === 'SetAnimationSpeed' && args.length === 2) {
      numA = parseNumberToken(args[1]);
      if (numA !== null) {
        ggbApi.setAnimationSpeed(stripOuterQuotes(args[0]), numA);
        return true;
      }
      return false;
    }

    if (name === 'StartAnimation' && args.length === 0) {
      ggbApi.startAnimation();
      return true;
    }

    if (name === 'SetTrace' && args.length === 2) {
      boolA = parseBoolToken(args[1]);
      if (boolA !== null) {
        ggbApi.setTrace(stripOuterQuotes(args[0]), boolA);
        return true;
      }
      return false;
    }

    if (name === 'SetCaption' && args.length === 2) {
      ggbApi.setCaption(stripOuterQuotes(args[0]), stripOuterQuotes(args[1]));
      return true;
    }

    if (name === 'ShowLabel' && args.length === 2) {
      boolA = parseBoolToken(args[1]);
      if (boolA !== null) {
        ggbApi.setLabelVisible(stripOuterQuotes(args[0]), boolA);
        return true;
      }
      return false;
    }

    if (name === 'SetVisible' && args.length === 2) {
      boolA = parseBoolToken(args[1]);
      if (boolA !== null) {
        ggbApi.setVisible(stripOuterQuotes(args[0]), boolA);
        return true;
      }
      return false;
    }

    if (name === 'SetLineStyle' && args.length === 2) {
      numA = parseNumberToken(args[1]);
      if (numA !== null) {
        ggbApi.setLineStyle(stripOuterQuotes(args[0]), numA);
        return true;
      }
      return false;
    }

    if (name === 'SetLineThickness' && args.length === 2) {
      numA = parseNumberToken(args[1]);
      if (numA !== null) {
        ggbApi.setLineThickness(stripOuterQuotes(args[0]), numA);
        return true;
      }
      return false;
    }

    if (name === 'SetPointSize' && args.length === 2) {
      numA = parseNumberToken(args[1]);
      if (numA !== null) {
        ggbApi.setPointSize(stripOuterQuotes(args[0]), numA);
        return true;
      }
      return false;
    }

    if (name === 'SetPointStyle' && args.length === 2) {
      numA = parseNumberToken(args[1]);
      if (numA !== null) {
        ggbApi.setPointStyle(stripOuterQuotes(args[0]), numA);
        return true;
      }
      return false;
    }

    if (name === 'SetFilling' && args.length === 2) {
      numA = parseNumberToken(args[1]);
      if (numA !== null) {
        ggbApi.setFilling(stripOuterQuotes(args[0]), numA);
        return true;
      }
      return false;
    }

    if (name === 'SetColor') {
      if (args.length === 4) {
        var r = parseNumberToken(args[1]);
        var g = parseNumberToken(args[2]);
        var b = parseNumberToken(args[3]);
        if (r !== null && g !== null && b !== null) {
          ggbApi.setColor(stripOuterQuotes(args[0]), r, g, b);
          return true;
        }
      }
      if (args.length === 2) {
        var rgb = colorTokenToRgb(args[1]);
        if (rgb) {
          ggbApi.setColor(stripOuterQuotes(args[0]), rgb[0], rgb[1], rgb[2]);
          return true;
        }
      }
      return false;
    }

    return false;
  }

  function maybeCreateImplicitLine(cmd) {
    var match = /^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*Line\s*\((.*)\)\s*$/.exec(String(cmd || '').trim());
    if (!match || !ggbApi || typeof ggbApi.evalCommandGetLabels !== 'function') return false;
    var targetName = match[1];
    var inner = String(match[2] || '').trim();
    var args = parseSimpleArgs(inner);
    if (args.length !== 1 || inner.indexOf('=') === -1) return false;
    var created = '';
    try {
      created = String(ggbApi.evalCommandGetLabels(inner) || '');
    } catch (_) {
      return false;
    }
    var first = created.split(',')[0] ? created.split(',')[0].trim() : '';
    if (!first) return false;
    if (first === targetName) return true;
    try {
      if (ggbApi.exists(targetName)) ggbApi.deleteObject(targetName);
    } catch (_) {}
    try {
      if (typeof ggbApi.renameObject === 'function' && ggbApi.renameObject(first, targetName)) {
        return true;
      }
    } catch (_) {}
    return true;
  }
  // Conditional-visibility bridge for legacy payloads.
  //
  // The GeoGebra Apps API does not accept SetConditionToShowObject(...)
  // through evalCommand (it is a GUI-only Object Properties setting). For
  // already-persisted visualizations that emit it we synthesise the same
  // behaviour: define a hidden boolean for the condition expression, read
  // its current value to set initial visibility, and register an update
  // listener so toggling the controlling slider/boolean re-applies it.
  var conditionRegistry = [];
  var conditionCounter = 0;

  function disposeConditions() {
    if (!ggbApi) { conditionRegistry = []; return; }
    for (var i = 0; i < conditionRegistry.length; i++) {
      var entry = conditionRegistry[i];
      try {
        if (entry.listener && typeof ggbApi.unregisterObjectUpdateListener === 'function') {
          ggbApi.unregisterObjectUpdateListener(entry.boolName);
        }
      } catch (_) {}
    }
    conditionRegistry = [];
  }

  function maybeApplyShowCondition(cmd) {
    var match = /^SetConditionToShowObject\s*\((.*)\)\s*$/.exec(String(cmd || '').trim());
    if (!match || !ggbApi) return false;
    var args = parseSimpleArgs(match[1]);
    if (args.length !== 2) return false;
    var targetName = stripOuterQuotes(args[0]).trim();
    var expr = String(args[1] || '').trim();
    if (!targetName || !expr) return false;
    if (!ggbApi.exists(targetName)) return false;
    conditionCounter += 1;
    var boolName = '__hgCond_' + conditionCounter;
    var defined = false;
    try {
      defined = ggbApi.evalCommand(boolName + '=' + expr) !== false;
    } catch (_) {}
    if (!defined) return false;
    try { ggbApi.setVisible(boolName, false); } catch (_) {}
    try { if (typeof ggbApi.setAuxiliary === 'function') ggbApi.setAuxiliary(boolName, true); } catch (_) {}
    function applyOnce() {
      try {
        var raw = ggbApi.getValue(boolName);
        ggbApi.setVisible(targetName, raw === 1 || raw === true);
      } catch (_) {}
    }
    applyOnce();
    var listener = null;
    try {
      if (typeof ggbApi.registerObjectUpdateListener === 'function') {
        listener = applyOnce;
        ggbApi.registerObjectUpdateListener(boolName, listener);
      }
    } catch (_) {}
    conditionRegistry.push({ boolName: boolName, listener: listener });
    return true;
  }

  function extractAssignedName(cmd) {
    var match = /^([A-Za-z_][A-Za-z0-9_]*)\s*(?:\([^)]*\))?\s*=/.exec(String(cmd || '').trim());
    return match ? match[1] : '';
  }

  function inferCommandTier(row, index) {
    var purpose = String(row && row.purpose || '').trim().toLowerCase();
    if (purpose.indexOf('[core]') === 0) return 'core';
    if (purpose.indexOf('[support]') === 0) return 'support';
    if (purpose.indexOf('[annotation]') === 0) return 'annotation';
    var cmd = String(row && row.command || '').trim();
    if (/^\s*[A-Za-z_][A-Za-z0-9_]*\s*=\s*Text\s*\(/.test(cmd) || /^\s*Text\s*\(/.test(cmd)) {
      return 'annotation';
    }
    return index < 8 ? 'core' : 'support';
  }

  function objectExists(name) {
    if (!name || !ggbApi || typeof ggbApi.exists !== 'function') return false;
    try { return !!ggbApi.exists(name); } catch (_) { return false; }
  }

  function getObjectNames() {
    if (!ggbApi) return [];
    try {
      if (typeof ggbApi.getAllObjectNames === 'function') {
        var names = ggbApi.getAllObjectNames();
        if (Array.isArray(names)) return names.map(function (name) {
          return String(name || '').trim();
        }).filter(Boolean);
        if (typeof names === 'string') return names.split(',').map(function (name) {
          return name.trim();
        }).filter(Boolean);
      }
    } catch (_) {}
    return [];
  }

  function getObjectCount() {
    var names = getObjectNames();
    if (Array.isArray(names)) return names.length;
    return 0;
  }

  function createdLabelsFrom(raw) {
    return raw
      ? String(raw).split(',').map(function (name) { return name.trim(); }).filter(Boolean)
      : [];
  }

  function nameSetFrom(names) {
    var out = {};
    if (!Array.isArray(names)) return out;
    names.forEach(function (name) {
      var key = String(name || '').trim();
      if (key) out[key] = true;
    });
    return out;
  }

  function tryRenameCreatedObjectToLhs(labels, lhs) {
    if (!lhs || objectExists(lhs) || !ggbApi || typeof ggbApi.renameObject !== 'function') {
      return objectExists(lhs);
    }
    if (!Array.isArray(labels) || !labels.length) return false;
    for (var i = 0; i < labels.length; i++) {
      var candidate = String(labels[i] || '').trim();
      if (!candidate || candidate === lhs || !objectExists(candidate)) continue;
      try {
        if (ggbApi.renameObject(candidate, lhs) && objectExists(lhs)) {
          labels[i] = lhs;
          postTrace('payload.create.step.renamed', {
            from: candidate,
            to: lhs,
          }, 'degraded', 'GeoGebra auto-named an assigned object; renamed it to the requested label');
          return true;
        }
      } catch (_) {}
    }
    return objectExists(lhs);
  }

  // ── 1. Bootstrap the GeoGebra applet ───────────────────────────────
  function disposeScriptListeners() {
    if (!ggbApi) {
      scriptListeners = [];
      return;
    }
    for (var i = 0; i < scriptListeners.length; i++) {
      var entry = scriptListeners[i];
      try {
        if (entry.kind === 'click' && typeof ggbApi.unregisterObjectClickListener === 'function') {
          ggbApi.unregisterObjectClickListener(entry.name);
        }
        if (entry.kind === 'update' && typeof ggbApi.unregisterObjectUpdateListener === 'function') {
          ggbApi.unregisterObjectUpdateListener(entry.name);
        }
      } catch (_) {}
      try {
        if (entry.fnName && Object.prototype.hasOwnProperty.call(window, entry.fnName)) {
          delete window[entry.fnName];
        }
      } catch (_) {}
    }
    scriptListeners = [];
  }

  function buildSettingsFromSpec(spec, appName) {
    var viewport = spec
      && spec.visual_design
      && spec.visual_design.coordinate_system
      && spec.visual_design.coordinate_system.suggested_viewport
      ? spec.visual_design.coordinate_system.suggested_viewport
      : null;
    return {
      perspective: appName === '3d' ? 'T' : 'G',
      coord_system: viewport
        ? [viewport.xmin, viewport.xmax, viewport.ymin, viewport.ymax]
        : null,
      axes_visible: true,
      grid_visible: false,
      show_algebra_input: false,
      show_tool_bar: false,
      show_menu_bar: false,
    };
  }

  function bootstrap(req) {
    var appName = inferAppNameFromRequest(req);
    var settings = buildSettingsFromSpec(req.spec || null, appName);
    if (ggbApp) {
      try { if (ggbApi && ggbApi.remove) ggbApi.remove(); } catch (_) {}
      ggbApp = null;
      ggbApi = null;
    }
    if (typeof GGBApplet !== 'function') {
      postError('GeoGebra 未加载: window.GGBApplet 不存在 (CDN 被 CSP 拒绝?)');
      return;
    }
    var params = {
      appName: appName,
      perspective: settings.perspective,
      width: window.innerWidth || 600,
      height: window.innerHeight || 400,
      showToolBar: false,
      showAlgebraInput: false,
      showMenuBar: false,
      showResetIcon: false,
      showZoomButtons: false,
      showAnimationButton: false,
      showFullscreenButton: false,
      showSuggestionButtons: false,
      showStartTooltip: false,
      allowStyleBar: false,
      enableUndoRedo: false,
      enableLabelDrags: false,
      enableShiftDragZoom: true,
      enableRightClick: false,
      errorDialogsActive: false,
      disableJavaScript: true,
      borderColor: '#ffffff',
      preventFocus: true,
      scaleContainerClass: 'ggb-applet',
      autoHeight: false,
      appletOnLoad: function (api) {
        ggbApi = api;
        currentAppName = appName;
        hideLoading();
        if (pendingRender) {
          var p = pendingRender; pendingRender = null;
          renderNow(p);
        } else {
          postReady();
        }
      },
    };
    try {
      ggbApp = new GGBApplet(params, true);
      ggbApp.inject('ggb-applet');
    } catch (e) {
      postError('GeoGebra 初始化失败: ' + (e && e.message || e));
    }
  }

  // ── 2. Render a viz: clear + apply settings + run commands ─────────
  function applySettings(settings) {
    if (!settings || !ggbApi) return;
    try {
      var perspective = inferPerspective(settings, currentAppName || 'classic');
      if (perspective) {
        ggbApi.setPerspective(perspective);
      }
      if (Array.isArray(settings.coord_system)) {
        var cs = settings.coord_system;
        if (cs.length >= 4) {
          ggbApi.setCoordSystem(cs[0], cs[1], cs[2], cs[3]);
        }
      }
      if (typeof settings.axes_visible === 'boolean') {
        ggbApi.setAxesVisible(settings.axes_visible, settings.axes_visible);
      }
      if (typeof settings.grid_visible === 'boolean') {
        ggbApi.setGridVisible(settings.grid_visible);
      }
      if (typeof settings.show_algebra_input === 'boolean') {
        ggbApi.showAlgebraInput(settings.show_algebra_input);
      }
      if (typeof settings.show_tool_bar === 'boolean') {
        ggbApi.showToolBar(settings.show_tool_bar);
      }
      if (typeof settings.show_menu_bar === 'boolean') {
        ggbApi.showMenuBar(settings.show_menu_bar);
      }
      if (typeof settings.perspective === 'string' && settings.perspective) {
        ggbApi.setPerspective(settings.perspective);
      }
    } catch (e) {
      // settings are best-effort; don't kill the render over bad coord_system
      console.warn('GeoGebra settings warning', e);
    }
  }

  function runCommandSteps(steps) {
    if (!steps || !steps.length) {
      return { createdObjects: [], partialFailures: [], coreFailures: [] };
    }
    postTrace('payload.create.start', { command_count: steps.length }, 'info', null);
    var partialFailures = [];
    var coreFailures = [];
    var createdObjects = [];
    for (var i = 0; i < steps.length; i++) {
      var row = steps[i] || {};
      var cmd = String(row.command || '').trim();
      if (!cmd) continue;
      var tier = inferCommandTier(row, i);
      var lhs = extractAssignedName(cmd);
      var beforeNameSet = nameSetFrom(getObjectNames());
      postTrace('payload.create.step.start', {
        step: row.step,
        command: cmd,
        purpose: row.purpose || '',
        tier: tier,
        lhs: lhs || null,
      }, 'info', null);
      try {
        var handledByBridge = false;
        if (maybeApplyApiCommand(cmd) || maybeCreateImplicitLine(cmd) || maybeApplyShowCondition(cmd)) {
          handledByBridge = true;
        }
        var created = '';
        if (!handledByBridge) {
          if (typeof ggbApi.evalCommandGetLabels === 'function') {
            created = String(ggbApi.evalCommandGetLabels(cmd) || '');
          } else {
            var ok = ggbApi.evalCommand(cmd);
            if (ok === false) {
              throw new Error('evalCommand returned false');
            }
          }
        }
        var labels = createdLabelsFrom(created);
        var existsLhs = lhs ? objectExists(lhs) : true;
        if (lhs && !existsLhs) {
          getObjectNames().forEach(function (name) {
            if (!beforeNameSet[name] && labels.indexOf(name) < 0) labels.push(name);
          });
        }
        if (lhs && !existsLhs) {
          existsLhs = tryRenameCreatedObjectToLhs(labels, lhs);
        }
        if (lhs && !existsLhs) {
          throw new Error('assigned object was not created: ' + lhs);
        }
        if (lhs && labels.indexOf(lhs) < 0) labels.push(lhs);
        createdObjects = createdObjects.concat(labels);
        postTrace('payload.create.step.ok', {
          step: row.step,
          command: cmd,
          created_labels: labels,
          tier: tier,
          lhs: lhs || null,
          exists_lhs: existsLhs,
        }, 'ok', null);
      } catch (e) {
        var failure = {
          phase: 'create',
          step: row.step,
          cmd: cmd,
          tier: tier,
          lhs: lhs || null,
          err: String(e && e.message || e),
        };
        postTrace('payload.create.step.error', {
          step: row.step,
          command: cmd,
          tier: tier,
          lhs: lhs || null,
          continued_after_failure: tier !== 'core',
        }, 'error', String(e && e.message || e));
        if (tier === 'core') {
          coreFailures.push(failure);
          break;
        }
        partialFailures.push(failure);
      }
    }
    if (coreFailures.length) {
      var preview = coreFailures.slice(0, 3).map(function (f) {
        return '#' + f.step + ' "' + f.cmd + '"' + (f.err ? ' (' + f.err + ')' : '');
      }).join('; ');
      postTrace('payload.create.error', {
        command_count: steps.length,
        failure_count: coreFailures.length,
        failures: coreFailures.slice(0, 5)
      }, 'error', preview);
      throw new Error(preview);
    }
    if (partialFailures.length) {
      var partialPreview = partialFailures.slice(0, 3).map(function (f) {
        return '#' + f.step + ' "' + f.cmd + '"' + (f.err ? ' (' + f.err + ')' : '');
      }).join('; ');
      postTrace('payload.create.partial', {
        command_count: steps.length,
        failure_count: partialFailures.length,
        failures: partialFailures.slice(0, 5),
      }, 'degraded', partialPreview);
    }
    postTrace('payload.create.ok', {
      command_count: steps.length,
      created_labels: createdObjects,
      partial_failure_count: partialFailures.length,
    }, 'ok', null);
    return { createdObjects: createdObjects, partialFailures: partialFailures, coreFailures: coreFailures };
  }

  function runPropertyCommandSteps(steps) {
    if (!steps || !steps.length) return;
    postTrace('payload.property.start', { command_count: steps.length }, 'info', null);
    var failures = [];
    for (var i = 0; i < steps.length; i++) {
      var row = steps[i] || {};
      var cmd = String(row.command || '').trim();
      if (!cmd) continue;
      postTrace('payload.property.step.start', { step: row.step, command: cmd, purpose: row.purpose || '' }, 'info', null);
      try {
        if (maybeApplyApiCommand(cmd) || maybeCreateImplicitLine(cmd) || maybeApplyShowCondition(cmd)) {
          postTrace('payload.property.step.ok', { step: row.step, command: cmd }, 'ok', null);
          continue;
        }
        var ok = ggbApi.evalCommand(cmd);
        if (ok === false) {
          failures.push({ phase: 'property', step: row.step, cmd: cmd });
          continue;
        }
        postTrace('payload.property.step.ok', { step: row.step, command: cmd }, 'ok', null);
      } catch (e) {
        failures.push({ phase: 'property', step: row.step, cmd: cmd, err: String(e && e.message || e) });
        postTrace('payload.property.step.error', { step: row.step, command: cmd }, 'error', String(e && e.message || e));
      }
    }
    if (failures.length) {
      var preview = failures.slice(0, 3).map(function (f) {
        return '#' + f.step + ' "' + f.cmd + '"' + (f.err ? ' (' + f.err + ')' : '');
      }).join('; ');
      postTrace('payload.property.degraded', {
        command_count: steps.length,
        failure_count: failures.length,
        failures: failures.slice(0, 5)
      }, 'degraded', preview);
      return;
    }
    postTrace('payload.property.ok', { command_count: steps.length }, 'ok', null);
  }

  function checkExpectedCreatedObjects(payload, createdObjects) {
    var expected = payload && Array.isArray(payload.expected_created_objects)
      ? payload.expected_created_objects
      : [];
    var commandTiers = buildCommandTierMap(payload && payload.commands || []);
    var createdSet = nameSetFrom(createdObjects || []);
    if (!expected.length || !ggbApi) {
      return { missingCore: [], missingSupport: [], missingSoft: [], coreExpectedCount: 0 };
    }
    var missing = [];
    var supportMissing = [];
    var softMissing = [];
    var coreExpectedCount = 0;
    for (var i = 0; i < expected.length; i++) {
      var row = expected[i] || {};
      var name = String(row.name || '').trim();
      if (!name) continue;
      var tier = expectedObjectTier(row, commandTiers);
      if (tier === 'core') coreExpectedCount += 1;
      try {
        if (!ggbApi.exists(name) && !createdSet[name]) {
          if (tier === 'annotation') softMissing.push(name);
          else if (tier === 'support') supportMissing.push(name);
          else missing.push(name);
        } else if (!ggbApi.exists(name) && createdSet[name]) {
          postTrace('payload.expected_objects.check.created_only', {
            name: name,
            tier: tier,
          }, 'degraded', 'Expected object was reported as created but no longer answers exists()');
        }
      } catch (_) {
        if (createdSet[name]) {
          postTrace('payload.expected_objects.check.created_only', {
            name: name,
            tier: tier,
          }, 'degraded', 'Expected object was reported as created but exists() check failed');
        } else if (tier === 'annotation') softMissing.push(name);
        else if (tier === 'support') supportMissing.push(name);
        else missing.push(name);
      }
    }
    if (supportMissing.length) {
      postTrace('payload.expected_objects.check.partial', {
        missing: supportMissing
      }, 'degraded', 'Missing support expected GeoGebra objects');
    }
    if (softMissing.length) {
      postTrace('payload.expected_objects.check.degraded', {
        missing: softMissing
      }, 'degraded', 'Missing non-core expected GeoGebra display objects');
    }
    if (missing.length) {
      postTrace('payload.expected_objects.check.error', { missing: missing }, 'error', 'Missing expected GeoGebra objects');
      throw new Error('Missing expected GeoGebra objects: ' + missing.join(', '));
    }
    postTrace('payload.expected_objects.check.ok', {
      names: expected.map(function (row) { return row.name; })
    }, 'ok', null);
    return {
      missingCore: missing,
      missingSupport: supportMissing,
      missingSoft: softMissing,
      coreExpectedCount: coreExpectedCount,
    };
  }

  function buildCommandTierMap(steps) {
    var tiers = {};
    if (!Array.isArray(steps)) return tiers;
    for (var i = 0; i < steps.length; i++) {
      var row = steps[i] || {};
      var lhs = extractAssignedName(row.command || '');
      if (lhs && !tiers[lhs]) tiers[lhs] = inferCommandTier(row, i);
    }
    return tiers;
  }

  function expectedObjectTier(row, commandTiers) {
    var name = String(row && row.name || '').trim();
    var fromCommand = name && commandTiers ? commandTiers[name] : '';
    if (fromCommand === 'core' || fromCommand === 'support' || fromCommand === 'annotation') {
      return fromCommand;
    }
    if (isSoftExpectedObject(row)) return 'annotation';
    if (isSupportExpectedObject(row)) return 'support';
    return 'core';
  }

  function isSoftExpectedObject(row) {
    var name = String(row && row.name || '').trim().toLowerCase();
    var type = String(row && row.type || '').trim().toLowerCase();
    var role = String(row && row.role || '').trim().toLowerCase();
    if (type === 'text' || type === 'label' || type === 'caption' || type === 'dynamic_text') return true;
    if (name.endsWith('_text') || name.endsWith('text')) return true;
    return role.indexOf('text') >= 0
      || role.indexOf('label') >= 0
      || role.indexOf('caption') >= 0
      || role.indexOf('display') >= 0
      || role.indexOf('annotation') >= 0;
  }

  function isSupportExpectedObject(row) {
    var role = String(row && row.role || '').trim().toLowerCase();
    var type = String(row && row.type || '').trim().toLowerCase();
    return role.indexOf('support') >= 0
      || role.indexOf('helper') >= 0
      || role.indexOf('auxiliary') >= 0
      || type === 'helper'
      || type === 'auxiliary';
  }

  function runOptionalScriptNow(optionalScript, params) {
    if (!optionalScript || !optionalScript.needed || !ggbApi) return;
    if (optionalScript.script_type === 'ggbscript') {
      var body = String(optionalScript.script_body || '').trim();
      if (body) {
        ggbApi.evalCommand(body);
      }
      return;
    }
    if (optionalScript.script_type === 'javascript') {
      var fn = new Function('ggbApi', 'spec', 'params', String(optionalScript.script_body || ''));
      fn(ggbApi, activeSpec || {}, params || {});
    }
  }

  function attachOptionalScript(optionalScript, params) {
    if (!optionalScript || !optionalScript.needed || !ggbApi) return;
    postTrace('payload.script.attach.start', {
      script_type: optionalScript.script_type,
      trigger: optionalScript.trigger,
      target_object: optionalScript.target_object,
    }, 'info', null);
    try {
      if (optionalScript.trigger === 'on_load' || optionalScript.trigger === 'none') {
        runOptionalScriptNow(optionalScript, params);
        postTrace('payload.script.attach.ok', { trigger: optionalScript.trigger }, 'ok', null);
        return;
      }
      var target = String(optionalScript.target_object || '').trim();
      if (!target) throw new Error('optional_script.target_object is required for event triggers');
      var handler = function () { runOptionalScriptNow(optionalScript, params); };
      scriptListenerCounter += 1;
      var fnName = '__hanswerScriptListener_' + scriptListenerCounter;
      window[fnName] = handler;
      if (optionalScript.trigger === 'on_click' && typeof ggbApi.registerObjectClickListener === 'function') {
        ggbApi.registerObjectClickListener(target, fnName);
        scriptListeners.push({ kind: 'click', name: target, fnName: fnName });
      } else if ((optionalScript.trigger === 'on_update' || optionalScript.trigger === 'on_drag_end')
        && typeof ggbApi.registerObjectUpdateListener === 'function') {
        ggbApi.registerObjectUpdateListener(target, fnName);
        scriptListeners.push({ kind: 'update', name: target, fnName: fnName });
      } else {
        try { delete window[fnName]; } catch (_) {}
        throw new Error('unsupported script trigger: ' + optionalScript.trigger);
      }
      postTrace('payload.script.attach.ok', { trigger: optionalScript.trigger, target_object: target }, 'ok', null);
    } catch (e) {
      postTrace('payload.script.attach.error', {
        trigger: optionalScript.trigger,
        target_object: optionalScript.target_object,
      }, 'error', String(e && e.message || e));
      throw e;
    }
  }

  function applyParams(params) {
    if (!params || !ggbApi) return;
    postTrace('params.apply.start', { names: Object.keys(params) }, 'info', null);
    Object.keys(params).forEach(function (name) {
      if (!ggbApi.exists(name)) return;
      var v = params[name];
      try {
        if (typeof v === 'boolean') {
          ggbApi.setValue(name, v ? 1 : 0);
        } else if (typeof v === 'number') {
          ggbApi.setValue(name, v);
        } else if (typeof v === 'string') {
          ggbApi.setTextValue(name, v);
        }
      } catch (e) {
        console.warn('setValue failed for', name, e);
      }
    });
    postTrace('params.apply.finished', { names: Object.keys(params) }, 'ok', null);
  }

  function renderNow(req) {
    if (!ggbApi) {
      pendingRender = req;
      return;
    }
    clearError();
    var t0 = performance.now();
    var payload = req.executionPayload || {};
    activeSpec = req.spec || null;
    postTrace('render.start', {
      command_count: (payload.commands || []).length,
      property_command_count: (payload.property_commands || []).length,
      parameter_names: Object.keys(req.params || {}),
      app_name: currentAppName,
      execution_mode: payload.execution_mode || 'command_only'
    }, 'info', null);
    try {
      // Wipe prior construction so re-renders are deterministic.
      try { ggbApi.reset(); } catch (_) {
        try { ggbApi.newConstruction(); } catch (_) {}
      }
      disposeConditions();
      disposeScriptListeners();
      ggbApi.setRepaintingActive(false);
      applySettings(buildSettingsFromSpec(req.spec || null, currentAppName || 'classic'));
      if (!payload.commands || !payload.commands.length) {
        postTrace('render.empty', { command_count: 0 }, 'degraded', 'GeoGebra command list is empty');
      }
      var createResult = runCommandSteps(payload.commands || []);
      runPropertyCommandSteps(payload.property_commands || []);
      attachOptionalScript(payload.optional_script || null, req.params || {});
      var expectedResult = checkExpectedCreatedObjects(payload, createResult.createdObjects || []);
      applyParams(req.params);
      try { ggbApi.showAllObjects && ggbApi.showAllObjects(); } catch (_) {}
      var objectCount = getObjectCount();
      if (objectCount === 0 && createResult.createdObjects && createResult.createdObjects.length > 0) {
        objectCount = createResult.createdObjects.length;
      }
      if (objectCount === 0 && (payload.commands || []).length > 0) {
        postTrace('render.empty_runtime', {
          command_count: (payload.commands || []).length,
          created_labels: createResult.createdObjects || [],
        }, 'error', 'GeoGebra runtime contains no objects after command execution');
        throw new Error('GeoGebra runtime contains no objects after command execution');
      }
      var partialFailureCount = (createResult.partialFailures || []).length
        + ((expectedResult && expectedResult.missingSupport) ? expectedResult.missingSupport.length : 0)
        + ((expectedResult && expectedResult.missingSoft) ? expectedResult.missingSoft.length : 0);
      if (partialFailureCount > 0) {
        postTrace('runtime.partial_passed', {
          object_count: objectCount,
          partial_failure_count: partialFailureCount,
          created_labels: createResult.createdObjects || [],
        }, 'degraded', 'Core GeoGebra objects rendered with partial support/annotation failures');
      }
      postMetric(performance.now() - t0, {
        object_count: objectCount,
        core_expected_count: expectedResult && typeof expectedResult.coreExpectedCount === 'number'
          ? expectedResult.coreExpectedCount
          : 0,
        missing_core_count: 0,
        partial_failure_count: partialFailureCount,
      });
    } catch (e) {
      postError('渲染异常: ' + (e && e.message || e));
      return;
    } finally {
      try { ggbApi && ggbApi.setRepaintingActive(true); } catch (_) {}
    }
    postReady();
  }

  // ── 3. Message loop ────────────────────────────────────────────────
  window.addEventListener('message', function (ev) {
    var msg = ev.data || {};
    switch (msg.type) {
      case 'init':
        postReady();
        break;
      case 'render': {
        var req = {
          executionPayload: msg.executionPayload || null,
          spec: msg.spec || null,
          params: msg.params || {},
        };
        var appName = inferAppNameFromRequest(req);
        // (Re)bootstrap if no applet yet, or app type changed.
        if (!ggbApi || currentAppName !== appName) {
          pendingRender = req;
          bootstrap(req);
        } else {
          renderNow(req);
        }
        break;
      }
      case 'update-params':
        applyParams(msg.params || {});
        break;
      case 'dispose':
        disposeScriptListeners();
        try { if (ggbApi && ggbApi.remove) ggbApi.remove(); } catch (_) {}
        ggbApi = null; ggbApp = null; currentAppName = null;
        break;
    }
  });

  // Send an early ready so the host can post the first render request.
  // (Real GeoGebra readiness comes from appletOnLoad; until then we
  // queue the render in pendingRender.)
  postReady();

  // Fail-fast if the CDN is unreachable.
  setTimeout(function () {
    if (typeof GGBApplet !== 'function') {
      postError('GeoGebra CDN 加载失败 (5s 超时)。请检查网络或 CSP 设置。');
    }
  }, 5000);
})();
</script>
</body>
</html>
